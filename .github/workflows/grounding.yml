# Grounding gate: runs on every pull request and every push to main.
# It keeps withdrawn references and unearned verdicts off the public site, checks every cited DOI against the
# offline cache, lints the Time & Gravity evidence labels, and checks that every interactive lab shows the readouts
# its folio prints. This repository is public, so GitHub Actions minutes are free here.
name: Grounding

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * 1" # weekly, Monday 14:17 UTC, to catch drift that arrives without a pull request
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grounding:
    name: Grounding checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Generated pages are up to date
        run: |
          # The build also rewrites binary artifacts and line endings that differ between machines, so compare
          # only the generated HTML text, ignoring line endings.
          python -X utf8 tools/build_longform_folios.py
          if ! git diff --quiet --ignore-cr-at-eol --ignore-space-at-eol -- 'src/**/*.html'; then
            git diff --stat --ignore-cr-at-eol --ignore-space-at-eol -- 'src/**/*.html' | tail -15
            echo "::error::generated HTML is out of date: run tools/build_longform_folios.py and commit"; exit 1
          fi

      - name: Withdrawn references and verdict language
        run: python -X utf8 tools/check_grounding_guards.py

      - name: Citations against the offline cache
        run: python -X utf8 tools/check_folio_citations.py

      - name: Time & Gravity evidence labels
        run: python -X utf8 tools/check_timegravity_labels.py

      - name: Tech & Tools claims
        run: python -X utf8 tools/check_toolchain_claims.py

      - name: Install Playwright (Chromium only)
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.64.1"
          python -m playwright install --with-deps chromium

      - name: Interactive labs match their folios
        run: python -X utf8 tools/check_lab_readouts.py
